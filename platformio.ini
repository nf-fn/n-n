; ポケットペット for M5Stack AtomS3R
; 設計: docs/superpowers/specs/2026-09-22-pocket-pet-design.md

[platformio]
default_envs = atoms3r

; 実機ビルド。ESP32-S3-PICO-1-N8R8 (8MB flash / 8MB octal PSRAM)
[env:atoms3r]
platform = espressif32@6.12.0
board = m5stack-atoms3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200

; AtomS3R の PSRAM は octal (R8)。m5stack-atoms3 ボード定義は PSRAM を
; 有効にしないため、ここで明示する。フェーズ 0 で実機確認する項目。
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    m5stack/M5Unified@0.2.7

; 純粋ロジック層を Mac 上でテストする。lib/pet 以下のみをビルド対象とし、
; M5 に依存するコードは一切含めない。
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I lib/pet
build_src_filter = -<*>
